openapi: 3.0.3
info:
  title: Happiness Atlas API
  version: 1.0.0
  description: |
    Vertrag zwischen dem vorbereiteten Frontend und dem Backend-Lernprojekt.
    Alle fachlichen Antworten haben `data` und `meta`. `meta.source=reference-data`
    kennzeichnet die Vorschau aus JSON; `meta.source=postgres` darf nur bei einer
    tatsächlich ausgeführten PostgreSQL-Abfrage verwendet werden.

    Die sechs fachlichen GET-Endpunkte werden in den Repository-Dateien umgesetzt.
    `GET /meta` und `GET /health` sind bereits fertig. Ein Jahr bezeichnet die
    Spalte `Year` der Quelle (`source_year`), keinen jährlichen Rohmesswert.
servers:
  - url: /api
    description: API auf demselben Host; funktioniert auch über den Vite-Proxy
tags:
  - name: Startdaten
    description: Das Frontend lädt Länder und Jahre vor jeder Seite.
  - name: Überblick
    description: Ranking, Suche, Seiten und Kennzahlen.
  - name: Länderverlauf
    description: Zeitreihe für Profil und Vergleichsdiagramm.
  - name: Ländervergleich
    description: Zwei Länder in einem Quellenjahr.
  - name: Veränderungen
    description: Veränderungen zwischen zwei Quellenjahren.
  - name: Datenbasis und Betrieb
    description: Bereits vorbereitete Metadaten und Datenbankprüfung.
paths:
  /years:
    get:
      tags: [Startdaten]
      operationId: getYears
      summary: Verfügbare Quellenjahre
      description: |
        `App.tsx` füllt damit alle Jahresauswahlen. Backend-Aufgabe T1.1:
        vorhandene `source_year`-Werte eindeutig und aufsteigend aus PostgreSQL lesen;
        `latest` ist das größte vorhandene Jahr. 2013 fehlt in der Quelle.
      responses:
        '200':
          description: 14 verfügbare Quellenjahre, aufsteigend sortiert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearsResponse'
              example:
                data:
                  years: [2011, 2012, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
                  latest: 2025
                meta: {source: reference-data, sourceReportYear: 2026, yearKind: source-year}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '500': {$ref: '#/components/responses/InternalError'}
  /countries:
    get:
      tags: [Startdaten]
      operationId: getCountries
      summary: Länder und Gebiete für Auswahllisten
      description: |
        `App.tsx` lädt diese Liste vor jeder Seite. Backend-Aufgabe T1.2:
        167 Länder/Gebiete mit stabiler ID aus `countries` lesen und nach Name
        sortieren. Die ID wird in Pfaden und Vergleichen benutzt.
      responses:
        '200':
          description: Alphabetisch sortierte Länderliste.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CountriesResponse'}
              example:
                data:
                  countries:
                    - {id: afghanistan, name: Afghanistan}
                    - {id: albania, name: Albania}
                meta: {source: reference-data, sourceReportYear: 2026, yearKind: source-year}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '500': {$ref: '#/components/responses/InternalError'}
  /rankings:
    get:
      tags: [Überblick]
      operationId: getRankings
      summary: Ranking mit Suche, Sortierung, Pagination und Jahreskennzahlen
      description: |
        Die Übersichtsseite benötigt `rows` für die Tabelle, `total` für den
        Seitenwechsel, `leaders` für die Top 8 und `summary` für die drei
        Kennzahlen. Backend-Aufgabe T1.3: `observations` mit `countries` verbinden.
        `summary` und `leaders` beziehen sich immer auf **alle** Länder des Jahres,
        unabhängig von Suche, Sortierung und Pagination. Originalränge erhalten.
        Für 2025 gibt es 147 Länder; Finland ist Rang 1 mit Score 7.764.
      parameters:
        - {$ref: '#/components/parameters/Year'}
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Order'}
      responses:
        '200':
          description: |
            Gefilterte Seite und ungefilterte Jahreskennzahlen. Eine Suche ohne
            Treffer liefert `rows=[]`, `total=0` und weiterhin HTTP 200.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RankingsResponse'}
        '400': {$ref: '#/components/responses/InvalidQuery'}
        '422': {$ref: '#/components/responses/UnavailableYear'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '500': {$ref: '#/components/responses/InternalError'}
  /countries/{countryId}/history:
    get:
      tags: [Länderverlauf]
      operationId: getCountryHistory
      summary: Alle vorhandenen Zeitstände eines Landes
      description: |
        Die Verlaufsseite und **beide Linien** im Ländervergleich rufen diesen
        Endpunkt auf. Backend-Aufgabe T2.1: erst die Länder-ID prüfen, dann
        Beobachtungen nach `source_year` aufsteigend lesen. Fehlende Jahre und
        Werte bleiben Lücken; keine künstlichen Punkte erzeugen.
      parameters:
        - {$ref: '#/components/parameters/CountryId'}
      responses:
        '200':
          description: Land und chronologisch aufsteigende Beobachtungen.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryResponse'}
        '400': {$ref: '#/components/responses/InvalidQuery'}
        '404': {$ref: '#/components/responses/CountryNotFound'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '500': {$ref: '#/components/responses/InternalError'}
  /compare:
    get:
      tags: [Ländervergleich]
      operationId: compareCountries
      summary: Zwei Länder in einem Quellenjahr vergleichen
      description: |
        Die Vergleichsseite zeigt Scores, Ränge, Faktorwerte und die Differenz.
        Für das gemeinsame Verlaufsdiagramm ruft sie zusätzlich zweimal
        `/countries/{countryId}/history` auf. Backend-Aufgabe T2.2: beide Länder
        prüfen und die Antwort in der Reihenfolge des Parameters `countries`
        ausgeben. Ein bekanntes Land ohne Wert in diesem Jahr erhält `null`
        an seiner Position; dann ist auch `scoreDifference=null`. Die Differenz
        ist immer erster Score minus zweiter Score.
      parameters:
        - {$ref: '#/components/parameters/CompareCountries'}
        - {$ref: '#/components/parameters/Year'}
      responses:
        '200':
          description: Vergleich einschließlich möglicher Datenlücke, z. B. Angola 2025.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComparisonResponse'}
        '400': {$ref: '#/components/responses/InvalidQuery'}
        '404': {$ref: '#/components/responses/CountryNotFound'}
        '422': {$ref: '#/components/responses/UnavailableYear'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '500': {$ref: '#/components/responses/InternalError'}
  /insights/trends:
    get:
      tags: [Veränderungen]
      operationId: getTrends
      summary: Veränderungen zwischen zwei Quellenjahren
      description: |
        Die Veränderungen-Seite benötigt sortierte Länderwerte, die Größe der
        Vergleichsmenge und ihre mittlere Veränderung. Backend-Aufgabe T3.1/T3.2:
        Beobachtungen über `country_id` verbinden. `rows` enthält nur Länder mit
        beiden Werten; `change=toScore-fromScore`. `matchedCountries` zählt die
        Schnittmenge, `excludedCountries` die übrigen Länder der Vereinigung.
        `meanChange` mittelt nur die gemeinsamen Länder. Die Suche innerhalb
        dieser Tabelle läuft bereits im Browser und ist kein API-Parameter.
      parameters:
        - {$ref: '#/components/parameters/FromYear'}
        - {$ref: '#/components/parameters/ToYear'}
      responses:
        '200':
          description: Veränderung je vergleichbarem Land, absteigend nach Änderung.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrendsResponse'}
        '400': {$ref: '#/components/responses/InvalidQuery'}
        '422': {$ref: '#/components/responses/UnavailableYear'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '500': {$ref: '#/components/responses/InternalError'}
  /meta:
    get:
      tags: [Datenbasis und Betrieb]
      operationId: getMetadata
      summary: Herkunft und Aufbereitung des Datensatzes
      description: |
        Die Seite „Daten & Methodik“ und `App.tsx` laden diese Daten. Der Endpunkt
        liest bereits `data/clean/metadata.json`; hierfür ist keine SQL-Aufgabe
        offen. `meta.source` bleibt hier `reference-data`, weil diese Metadaten
        aus der Datei kommen.
      responses:
        '200':
          description: Vollständiger Datenbericht für die Methodikseite.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetadataResponse'}
  /health:
    get:
      tags: [Datenbasis und Betrieb]
      operationId: getHealth
      summary: Datenbank und Erstimport prüfen
      description: |
        Eigener Antworttyp ohne `data`/`meta`. Der Endpunkt führt bereits eine
        PostgreSQL-Abfrage gegen `bootstrap_status` aus.
      responses:
        '200':
          description: Datenbank erreichbar und Import abgeschlossen.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthReady'}
              example: {status: ok, database: ready, exerciseFixtures: true}
        '503':
          description: Datenbank nicht erreichbar oder Import unvollständig.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthDegraded'}
              example: {status: degraded, database: unavailable}
components:
  parameters:
    Year:
      name: year
      in: query
      required: true
      description: Verfügbares Quellenjahr aus `GET /years`; 2013 ist nicht vorhanden.
      schema: {type: integer, minimum: 1900, maximum: 2100, example: 2025}
    CountryId:
      name: countryId
      in: path
      required: true
      description: Stabile ID aus `GET /countries`, z. B. `germany`.
      schema: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 100, example: germany}
    Search:
      name: q
      in: query
      required: false
      description: |
        Teilstring im kanonischen Ländernamen, ohne Groß-/Kleinschreibung.
        `%` und `_` werden wörtlich gesucht, nicht als SQL-Wildcards.
      schema: {type: string, maxLength: 100, default: '', example: germany}
    Limit:
      name: limit
      in: query
      required: false
      description: Höchstzahl der Tabellenzeilen je Seite.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20, example: 15}
    Offset:
      name: offset
      in: query
      required: false
      description: Anzahl übersprungener Suchtreffer; ein Offset hinter dem Ende ergibt `rows=[]`.
      schema: {type: integer, minimum: 0, maximum: 10000, default: 0, example: 0}
    Order:
      name: order
      in: query
      required: false
      description: |
        `desc` zeigt die höchsten Scores zuerst (Originalrang aufsteigend);
        `asc` zeigt die umgekehrte Reihenfolge. Originalränge nicht neu berechnen.
      schema: {type: string, enum: [desc, asc], default: desc}
    CompareCountries:
      name: countries
      in: query
      required: true
      description: Genau zwei unterschiedliche IDs aus `GET /countries`, in Ausgabe-Reihenfolge.
      schema: {type: string, example: 'germany,finland'}
    FromYear:
      name: from
      in: query
      required: true
      description: Verfügbares Start-Quellenjahr; muss kleiner als `to` sein.
      schema: {type: integer, minimum: 1900, maximum: 2100, example: 2018}
    ToYear:
      name: to
      in: query
      required: true
      description: Verfügbares End-Quellenjahr; muss größer als `from` sein.
      schema: {type: integer, minimum: 1900, maximum: 2100, example: 2025}
  responses:
    InvalidQuery:
      description: Fehlender, mehrfacher oder ungültiger Parameter; auch `from >= to`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: INVALID_QUERY, message: 'year muss genau einmal angegeben werden.'}}
    UnavailableYear:
      description: Ganzzahliges Jahr ist im gelieferten Datensatz nicht vorhanden.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: UNAVAILABLE_YEAR, message: 'Für 2013 gibt es keine Daten.'}}
    CountryNotFound:
      description: Die syntaktisch gültige Länder-ID ist unbekannt.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: COUNTRY_NOT_FOUND, message: 'Dieses Land ist nicht im Datensatz vorhanden.'}}
    NotImplemented:
      description: |
        Fachliche Repository-Methode ist noch offen und
        `ENABLE_EXERCISE_FIXTURES=false` deaktiviert den Referenzadapter.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: NOT_IMPLEMENTED, message: 'Diese SQL-Aufgabe ist noch offen.'}}
    InternalError:
      description: Unerwarteter Fehler; SQL-Details werden nicht an den Browser gesendet.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: INTERNAL_ERROR, message: 'Die Anfrage konnte nicht verarbeitet werden.'}}
  schemas:
    ApiMeta:
      type: object
      required: [source, sourceReportYear, yearKind]
      properties:
        source:
          type: string
          enum: [reference-data, postgres]
          description: '`postgres` nur für eine tatsächlich aus PostgreSQL erzeugte Antwort.'
        sourceReportYear: {type: integer, enum: [2026]}
        yearKind: {type: string, enum: [source-year]}
    Country:
      type: object
      required: [id, name]
      properties:
        id: {type: string, example: finland, description: Stabile ID für API-Pfade und Vergleiche.}
        name: {type: string, example: Finland, description: Kanonischer Anzeigename.}
    Factors:
      type: object
      description: |
        Modellierte Beiträge in Score-Punkten. Fehlende Werte bleiben `null`;
        negative Residuen bleiben negativ. Keine Kausalitätsaussage.
      required: [gdp, socialSupport, healthyLife, freedom, generosity, corruption, residual]
      properties:
        gdp: {type: number, nullable: true, example: 1.915}
        socialSupport: {type: number, nullable: true, example: 1.638}
        healthyLife: {type: number, nullable: true, example: 0.939}
        freedom: {type: number, nullable: true, example: 1.105}
        generosity: {type: number, nullable: true, example: 0.093}
        corruption: {type: number, nullable: true, example: 0.491}
        residual: {type: number, nullable: true, example: 1.582}
    Observation:
      type: object
      description: Eine veröffentlichte Länderbeobachtung; Zahlen bleiben JSON-Zahlen.
      required: [countryId, countryName, sourceCountryName, year, rank, score, lower, upper, factors]
      properties:
        countryId: {type: string, example: finland}
        countryName: {type: string, example: Finland}
        sourceCountryName: {type: string, example: Finland, description: Ursprünglicher Name in der Quelldatei.}
        year: {type: integer, example: 2025, description: 'Quellenjahr `source_year`, kein einzelnes Befragungsjahr.'}
        rank: {type: integer, minimum: 1, example: 1, description: Originalrang der Quelle.}
        score: {type: number, minimum: 0, maximum: 10, example: 7.764}
        lower: {type: number, nullable: true, example: 7.69, description: Untere Grenze des 95%-Konfidenzintervalls.}
        upper: {type: number, nullable: true, example: 7.837, description: Obere Grenze des 95%-Konfidenzintervalls.}
        factors: {$ref: '#/components/schemas/Factors'}
    YearsData:
      type: object
      required: [years, latest]
      properties:
        years:
          type: array
          description: Vorhandene Quellenjahre, eindeutig und aufsteigend.
          items: {type: integer}
        latest: {type: integer, example: 2025}
    CountriesData:
      type: object
      required: [countries]
      properties:
        countries:
          type: array
          description: Alphabetisch nach `name` sortiert.
          items: {$ref: '#/components/schemas/Country'}
    RankingsData:
      type: object
      required: [year, rows, total, leaders, summary]
      properties:
        year: {type: integer, example: 2025}
        rows:
          type: array
          description: Suchtreffer nach Sortierung und Pagination.
          items: {$ref: '#/components/schemas/Observation'}
        total: {type: integer, minimum: 0, description: 'Treffer nach Suche, vor Pagination.'}
        leaders:
          type: array
          description: Erste acht Originalränge des ganzen Jahres, unabhängig von `q` und Seite.
          items: {$ref: '#/components/schemas/Observation'}
        summary:
          type: object
          description: Kennzahlen aller Länder des Jahres, unabhängig von Suche und Seite.
          required: [count, meanScore, leader]
          properties:
            count: {type: integer, example: 147}
            meanScore: {type: number, description: Ungewichtetes Ländermittel.}
            leader: {$ref: '#/components/schemas/Observation'}
    HistoryData:
      type: object
      required: [country, observations]
      properties:
        country: {$ref: '#/components/schemas/Country'}
        observations:
          type: array
          description: Nur vorhandene Zeitstände, nach `year` aufsteigend.
          items: {$ref: '#/components/schemas/Observation'}
    ComparisonData:
      type: object
      required: [year, countries, observations, scoreDifference]
      properties:
        year: {type: integer, example: 2025}
        countries:
          type: array
          minItems: 2
          maxItems: 2
          description: Exakt zwei Länder in Anfrage-Reihenfolge.
          items: {$ref: '#/components/schemas/Country'}
        observations:
          type: array
          minItems: 2
          maxItems: 2
          description: |
            Beobachtungen in derselben Reihenfolge; ein bekanntes Land ohne
            Wert im gewählten Jahr steht als `null` an seiner Position.
          items:
            type: object
            nullable: true
            allOf:
              - {$ref: '#/components/schemas/Observation'}
        scoreDifference:
          type: number
          nullable: true
          description: Erster minus zweiter Score; `null`, wenn ein Wert fehlt.
    TrendRow:
      type: object
      required: [countryId, countryName, fromScore, toScore, change]
      properties:
        countryId: {type: string, example: germany}
        countryName: {type: string, example: Germany}
        fromScore: {type: number, description: Score im Start-Quellenjahr.}
        toScore: {type: number, description: Score im End-Quellenjahr.}
        change: {type: number, description: '`toScore - fromScore`; darf negativ sein.'}
    TrendsData:
      type: object
      required: [from, to, rows, matchedCountries, excludedCountries, meanChange]
      properties:
        from: {type: integer, example: 2018}
        to: {type: integer, example: 2025}
        rows:
          type: array
          description: Nur Länder mit beiden Werten; `change` absteigend, ID als Tie-Breaker.
          items: {$ref: '#/components/schemas/TrendRow'}
        matchedCountries: {type: integer, minimum: 0, description: Anzahl Länder in beiden Jahren.}
        excludedCountries: {type: integer, minimum: 0, description: Länder in der Vereinigung ohne Wertepaar.}
        meanChange: {type: number, description: Ungewichtetes Mittel der `change`-Werte in `rows`.}
    DatasetMetadata:
      type: object
      description: Datenbericht aus `data/clean/metadata.json` für die Methodikseite.
      required: [title, sourceUrl, sourcePage, sourceReportYear, retrievedOn, sourceSha256, yearMeaning, knownLatestPeriod, years, missingYears, rowCount, countryCount, aliasedRows, rowsPerYear, missingFactors, missingConfidenceIntervals, licenseNote, normalization]
      properties:
        title: {type: string, example: 'World Happiness Report 2026 · Figure 2.1'}
        sourceUrl: {type: string, format: uri}
        sourcePage: {type: string, format: uri}
        sourceReportYear: {type: integer, example: 2026}
        retrievedOn: {type: string, format: date, example: '2026-09-28'}
        sourceSha256: {type: string, description: SHA-256 der Original-XLSX-Datei.}
        yearMeaning: {type: string}
        knownLatestPeriod:
          type: object
          required: [year, from, to]
          properties:
            year: {type: integer, example: 2025}
            from: {type: integer, example: 2023}
            to: {type: integer, example: 2025}
        years: {type: array, items: {type: integer}}
        missingYears: {type: array, items: {type: integer}}
        rowCount: {type: integer, example: 2116}
        countryCount: {type: integer, example: 167}
        aliasedRows: {type: integer, example: 5}
        rowsPerYear: {type: object, additionalProperties: {type: integer}}
        missingFactors: {type: object, additionalProperties: {type: integer}}
        missingConfidenceIntervals: {type: integer}
        licenseNote: {type: string}
        normalization: {type: array, items: {type: string}}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_QUERY, INVALID_RANGE, INVALID_COUNTRY, UNAVAILABLE_YEAR, COUNTRY_NOT_FOUND, NOT_FOUND, NOT_IMPLEMENTED, INTERNAL_ERROR]
            message: {type: string, description: Lesbare Fehlermeldung für die Oberfläche.}
    HealthReady:
      type: object
      required: [status, database, exerciseFixtures]
      properties:
        status: {type: string, enum: [ok]}
        database: {type: string, enum: [ready]}
        exerciseFixtures: {type: boolean}
    HealthDegraded:
      type: object
      required: [status, database]
      properties:
        status: {type: string, enum: [degraded]}
        database: {type: string, enum: [unavailable]}
    YearsResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/YearsData'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    CountriesResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/CountriesData'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    RankingsResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/RankingsData'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    HistoryResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/HistoryData'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    ComparisonResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/ComparisonData'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    TrendsResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/TrendsData'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    MetadataResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/DatasetMetadata'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
