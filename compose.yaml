name: happiness-lab

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:?WEB_PORT in .env setzen}:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      PORT: 3000
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB in .env setzen}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER in .env setzen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    ports:
      - "127.0.0.1:${API_PORT:?API_PORT in .env setzen}:3000"
    volumes:
      - ./backend/src:/server/src
    depends_on:
      - database

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB in .env setzen}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER in .env setzen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT in .env setzen}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
