name: happiness-lab

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      PORT: 3000
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: happiness
      POSTGRES_USER: happiness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-happiness_local}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/server/src
    depends_on:
      - database

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: happiness
      POSTGRES_USER: happiness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-happiness_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
